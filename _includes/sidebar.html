<!-- begin sidebar -->
<aside class="sidebar">
  <div class="sidebar__inner">
    <div class="sidebar__intro">
      <p class="sidebar__name">{{ site.data.settings.author.name }}</p>
      <p class="sidebar__role">{{ site.data.settings.author.role }}</p>
      <p class="sidebar__tagline">{{ site.data.settings.author.tagline }}</p>
      <p class="sidebar__location">{{ site.data.settings.author.location }}</p>
    </div>

    <nav class="sidebar__nav" aria-label="Section navigation">
      <ul class="sidebar__nav-list list-reset">
        <li><a href="#about" class="sidebar__nav-link"><span class="sidebar__nav-line"></span>About</a></li>
        <li><a href="#experience" class="sidebar__nav-link"><span class="sidebar__nav-line"></span>Experience</a></li>
        <li><a href="#skills" class="sidebar__nav-link"><span class="sidebar__nav-line"></span>Skills</a></li>
        <li><a href="#projects" class="sidebar__nav-link"><span class="sidebar__nav-line"></span>Projects</a></li>
        <li><a href="#contact" class="sidebar__nav-link"><span class="sidebar__nav-line"></span>Contact</a></li>
      </ul>
    </nav>

    <div class="sidebar__footer">
      <a class="sidebar__resume-link" href="{{ site.baseurl }}{{ site.data.settings.author.resume }}" target="_blank" rel="noopener">
        <i class="ion ion-ios-download"></i> Resume
      </a>
      <ul class="sidebar__social list-reset">
        <li><a href="{{ site.data.settings.linkedin }}" target="_blank" rel="noopener" aria-label="LinkedIn"><i class="ion ion-logo-linkedin"></i></a></li>
        <li><a href="{{ site.data.settings.github }}" target="_blank" rel="noopener" aria-label="GitHub"><i class="ion ion-logo-github"></i></a></li>
        <li><a href="mailto:{{ site.data.settings.author.email }}" aria-label="Email"><i class="ion ion-ios-mail"></i></a></li>
      </ul>
    </div>
  </div>
</aside>
<!-- end sidebar -->
