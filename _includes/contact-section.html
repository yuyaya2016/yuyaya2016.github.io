<!-- begin contact-section -->
<section class="section contact-section" id="contact">
  <div class="container">
    <div class="row">
      <div class="col col-12 text-center">
        <h2 class="section__title">Let's Talk</h2>
        <p class="section__subtitle">Open to Senior Analytics Engineer and Data Engineer roles. {{ site.data.settings.author.location }}.</p>
        <div class="contact-section__actions">
          <a class="btn btn--primary" href="mailto:{{ site.data.settings.author.email }}">
            <i class="ion ion-ios-mail"></i> {{ site.data.settings.author.email }}
          </a>
          <a class="btn btn--outline" href="{{ site.data.settings.linkedin }}" target="_blank" rel="noopener">
            <i class="ion ion-logo-linkedin"></i> LinkedIn
          </a>
          <a class="btn btn--outline" href="{{ site.data.settings.github }}" target="_blank" rel="noopener">
            <i class="ion ion-logo-github"></i> GitHub
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
<!-- end contact-section -->
